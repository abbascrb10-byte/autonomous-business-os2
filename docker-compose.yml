services:
  postgres:
    image: postgres:16-alpine
    container_name: gpie-postgres
    restart: always
    environment:
      POSTGRES_USER: gpie
      POSTGRES_PASSWORD: gpie_password
      POSTGRES_DB: gpie_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpie -d gpie_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gpie-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: gpie-app
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=GPIE Professional v1
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://gpie:gpie_password@postgres:5432/gpie_db
      - SYNC_DATABASE_URL=postgresql://gpie:gpie_password@postgres:5432/gpie_db
      - REDIS_URL=redis://redis:6379/0
      - AI_PROVIDER=ollama
      - OUTREACH_PROVIDER=local_approval
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build: .
    container_name: gpie-worker
    restart: always
    command: ["python", "-m", "app.workers.runner"]
    env_file:
      - .env
    environment:
      - APP_NAME=GPIE Worker
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://gpie:gpie_password@postgres:5432/gpie_db
      - SYNC_DATABASE_URL=postgresql://gpie:gpie_password@postgres:5432/gpie_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
